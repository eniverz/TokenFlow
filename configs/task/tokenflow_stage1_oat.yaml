# @package _global_

defaults:
  - /train: trainer
  - /model: oat
  - /train/accelerator: zero2
  - _self_

task_name: tokenflow_stage1_oat
action_horizon: 16
pre_device_batch_size: 2048
gradient_accumulation_steps: 1
num_workers: 24
num_train_steps: 100000
log_interval: 100
save_interval: 10000

# Same LIBERO actions and global normalization as resvla_libero.
dataset_root: /2022533089/datasets/StarVLA_datasets/libero
norm_stats_dir: norm_stats/tokenflow/libero
dataset:
  _target_: resVLA.data.mixture_dataset.MixtureDataset
  weights:
    - 1.0
  datasets:
    - ${oc.create:${oc.load:configs/dataset/libero_tokenflow_oat.yaml}}

# Stage 1 trains from scratch and collates action tensors directly.
weight_loader:
  _target_: resVLA.training.weight_loader.CompositeWeightLoader
  loaders: []

collate_fn:
  _target_: torch.utils.data.default_collate
  _partial_: true

train:
  dataloader:
    collate_fn: ${collate_fn}
  accelerator:
    # Train both reconstruction branches in fp32.
    mixed_precision: "no"
    log_with: wandb

optimizer:
  _target_: resVLA.optim.GroupedAdamW
  lr: 1.0e-4
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  _target_: resVLA.optim.WarmupConstantCosineLR
  num_training_steps: ${num_train_steps}
  num_warmup_steps: 1000
  constant_end_ratio: 0.25
  lr_min_ratio: 0.1
  num_cycles: 0.5

wandb:
  project: resvla
  name: ${task_name}_${now:%m%d}
  group: ${task_name}
  dir: ${hydra:run.dir}/wandb
