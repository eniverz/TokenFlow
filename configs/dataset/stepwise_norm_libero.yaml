_target_: resVLA.data.transform_dataset.TransformDataset
repo_ids:
- /2022533089/datasets/StarVLA_datasets/libero/libero_10_no_noops_1.0.0_lerobot
- /2022533089/datasets/StarVLA_datasets/libero/libero_goal_no_noops_1.0.0_lerobot
- /2022533089/datasets/StarVLA_datasets/libero/libero_object_no_noops_1.0.0_lerobot
- /2022533089/datasets/StarVLA_datasets/libero/libero_spatial_no_noops_1.0.0_lerobot
lerobot_version: v2.1
action_horizon: ${action_horizon}
action_only: false
video_backend: pyav
transform:
  - _target_: resVLA.data.transform.process.RepackTransform
    repack:
      actions: action
      states: observation.state
      images:
        cam_high: observation.images.image
        cam_wrist: observation.images.wrist_image
      prompt: task
  - _target_: resVLA.data.transform.prompt.InjectDefaultPrompt
  - _target_: resVLA.data.transform.prompt.CoTPrompt
  - _target_: resVLA.data.transform.embodiment.InjectEmbodiment
    embodiment: "franka"
  - _target_: resVLA.data.transform.action.InjectActionTimestamp
    action_horizon: ${action_horizon}
    action_freq: 20
  - _target_: resVLA.data.transform.action.StepwiseNormalizer
    action_norm_stats:
      _target_: resVLA.data.transform.action.NormStats
      path: norm_stats/${task_name}/libero/action_stats.json
      stepwise: true
      mask: [true, true, true, true, true, true, false]
    state_norm_stats:
      _target_: resVLA.data.transform.action.NormStats
      path: norm_stats/${task_name}/libero/state_stats.json
      mask: [true, true, true, true, true, true, false, false]
    norm_type: quantile
  - _target_: resVLA.data.transform.action.PadStateAction
    action_dim: ${action_dim}
  - _target_: resVLA.data.transform.image.ResizeImage
    size: [224, 224]
